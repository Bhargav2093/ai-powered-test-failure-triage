name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        # No ANTHROPIC_API_KEY is set here on purpose: the LLM narrator layer
        # degrades to a deterministic template with no key, and the mocked
        # LLM tests in test_llm.py don't need one either. CI proves the tool
        # works with zero API cost.
        run: pytest -v

      - name: CLI smoke test against the bundled fixtures
        run: |
          python -m triage.cli --junit-xml tests/fixtures/synthetic/mixed_failures.xml \
            tests/fixtures/real_framework_failure/junit-report.xml \
            --format json --output triage-report.json
          cat triage-report.json
